name: bulkmart
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  go_router: ^14.6.2
  provider: ^6.1.2
  flutter_animate: ^4.5.2
  google_sign_in: ^6.2.2
  pin_code_fields: ^8.0.1
  intl: ^0.19.0
  fl_chart: ^0.69.0
  shared_preferences: ^2.3.3
  flutter_svg: ^2.0.16
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0
  supabase_flutter: ^2.8.0
  uuid: ^4.5.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  location: ^10.0.2
  razorpay_flutter: ^1.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#059669"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#059669"
  image: assets/icon/splash_icon.png
  android_12:
    color: "#059669"
    image: assets/icon/splash_icon.png
  android: true
  ios: true
